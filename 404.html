<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:;"
    />
    <title>404 — DotMatrix Studio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      rel="preload"
      href="assets/fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css?v=17" />
    <style>
      .error-page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100svh;
        padding: 20px;
      }
      .error-panel {
        width: 100%;
        max-width: 480px;
        padding: 48px 40px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      .error-code {
        font-family: var(--dm-font-mono);
        font-size: clamp(72px, 15vw, 112px);
        font-weight: 700;
        line-height: 1;
        color: var(--dm-primary);
        text-shadow:
          0 0 30px var(--dm-primary-soft),
          0 0 60px var(--dm-primary-soft);
        letter-spacing: -0.02em;
      }
      .error-dots {
        display: flex;
        gap: 6px;
        margin-top: -8px;
      }
      .error-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--dm-primary);
        opacity: 0.4;
      }
      .error-title {
        font-family: var(--dm-font-mono);
        font-size: 15px;
        font-weight: 600;
        color: var(--dm-text-strong);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 4px;
      }
      .error-desc {
        font-size: 13px;
        color: var(--dm-text-weak);
        line-height: 1.6;
        max-width: 320px;
      }
      .error-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 8px;
      }
      .error-btn {
        font-family: var(--dm-font-mono);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 8px 20px;
        border-radius: 8px;
        border: 1px solid var(--dm-border-base);
        background: none;
        color: var(--dm-text-base);
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.2s,
          border-color 0.2s,
          color 0.2s;
        display: inline-block;
      }
      .error-btn:hover {
        background: var(--dm-surface-hover);
        border-color: var(--dm-border-hover);
        color: var(--dm-text-strong);
      }
      .error-btn.primary {
        background: var(--dm-primary-soft);
        border-color: var(--dm-primary);
        color: var(--dm-primary);
      }
      .error-btn.primary:hover {
        background: var(--dm-primary);
        color: var(--dm-text-invert);
      }
      .error-footer {
        font-family: var(--dm-font-mono);
        font-size: 10px;
        color: var(--dm-text-weaker);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 12px;
      }
    </style>
  </head>
  <body class="dark-mode">
    <div class="app-bg" id="appBg" data-anim="pulse">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <div class="error-page">
      <div class="glass-panel error-panel">
        <div class="error-code">404</div>
        <div class="error-dots">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="error-title">Seite nicht gefunden</div>
        <p class="error-desc">
          Die aufgerufene Seite existiert nicht oder wurde verschoben.
          Überprüfe die URL oder kehre zur App zurück.
        </p>
        <div class="error-actions">
          <a href="javascript:history.back()" class="error-btn">← Zurück</a>
          <a href="index.html" class="error-btn primary">Zur App</a>
        </div>
        <div class="error-footer">DotMatrix Studio</div>
      </div>
    </div>
  </body>
</html>

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dotmatrix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dotmatrixpassword}
      POSTGRES_DB: ${DB_NAME:-dotmatrix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-dotmatrix}:${DB_PASSWORD:-dotmatrixpassword}@db:5432/${DB_NAME:-dotmatrix}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dotmatrix-projects}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_to_a_random_string}
    ports:
      - "3000:3000"
    depends_on:
      - db
      - minio
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
  minio_data:
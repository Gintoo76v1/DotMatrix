<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DotMatrix Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode"> <div class="app-container">
    
    <nav class="activity-bar">
      <div class="icon-btn active" data-tab="tab-source" title="Source & Print">🖨️</div>
      <div class="icon-btn" data-tab="tab-presets" title="Presets">📂</div>
      <div class="icon-btn" data-tab="tab-errors" title="Hardware Errors">🔧</div>
      <div class="spacer"></div>
      <div class="icon-btn" data-tab="tab-system" title="System Settings">⚙️</div>
    </nav>

    <aside class="sidebar glass-card">
      
      <div class="tab-content active" id="tab-source">
        <h2 data-i18n="sourceTitle">Bildquelle</h2>
        <div id="dropzone" class="dropzone">
          <div class="big" id="dzBig" data-i18n="dropzoneBig">Bild auswählen</div>
          <div class="small" id="dzSmall">PNG · JPG · HEIC · WebP</div>
          <input type="file" id="fileInput" accept="image/*">
        </div>

        <h2 data-i18n="profileTitle" style="margin-top:20px;">Druckerprofil</h2>
        <div class="scroll-list" id="profileList">
          </div>
        <div class="profile-meta" id="profileMeta"></div>

        <h2 data-i18n="adjustTitle" style="margin-top:20px;">Bildanpassung</h2>
        <label class="field"><span class="name"><span>Helligkeit</span><b id="brightnessVal">0</b></span><input type="range" id="brightnessSlider" min="-100" max="100" value="0"></label>
        <label class="field"><span class="name"><span>Kontrast</span><b id="contrastVal">20</b></span><input type="range" id="contrastSlider" min="-100" max="100" value="20"></label>
        
        <h2 data-i18n="inkTitle" style="margin-top:20px;">Tinte</h2>
        <div class="custom-ink-row">
          <input type="color" id="inkColorPicker" class="color-picker" value="#19191e" title="Farbe wählen">
          <input type="text" id="inkHexInput" class="hex-input text-input" value="#19191e" maxlength="7" spellcheck="false">
        </div>
      </div>

      <div class="tab-content" id="tab-presets">
        <h2 data-i18n="presetsTitle">Presets</h2>
        <div class="scroll-list" id="presetList">
          </div>
        <div class="action-row" style="margin-top:10px;">
          <button class="btn-sm" id="exportPresetBtn" data-i18n="btnExport">Export YAML</button>
          <button class="btn-sm" id="importPresetBtn" data-i18n="btnImport">Import YAML</button>
          <input type="file" id="presetFileInput" accept=".yaml,.yml,.json" style="display:none">
        </div>
        <div style="margin-top:20px;">
          <input type="text" id="presetNameInput" class="text-input" placeholder="Name für neues Preset">
          <button class="btn-sm" id="savePresetBtn" style="width:100%; margin-top:8px;" data-i18n="btnSavePreset">Als neues Preset speichern</button>
        </div>
      </div>

      <div class="tab-content" id="tab-errors">
        <h2 data-i18n="errorsTitle">Hardware Fehler</h2>
        <div class="scroll-list" id="errorList">
          </div>
      </div>

      <div class="tab-content" id="tab-system">
        <h2 data-i18n="systemTitle">System</h2>
        <label class="field">
          <span class="name">Language / Sprache</span>
          <select id="langSelector" class="text-input">
            <option value="de">🇩🇪 Deutsch</option>
            <option value="en">🇺🇸 English</option>
            <option value="fr">🇫🇷 Français</option>
          </select>
        </label>
        <label class="field" style="margin-top:15px;">
          <span class="name">UI Theme Mode</span>
          <select id="themeModeSelector" class="text-input">
            <option value="dark">🌙 Dark Mode</option>
            <option value="light">☀️ Light Mode</option>
          </select>
        </label>
      </div>

      <div class="sidebar-actions">
        <div id="status" class="status">Bereit.</div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn primary" id="renderBtn" disabled data-i18n="btnRender">Rendern</button>
          <button class="btn" id="downloadBtn" disabled>PNG</button>
        </div>
      </div>
    </aside>

    <main class="main-editor">
      <div class="toolbar">
        <span data-i18n="previewTitle">Live-Vorschau</span>
        <div class="zoom-controls">
          <button id="zoomOut">➖</button>
          <span id="zoomLevel">100%</span>
          <button id="zoomIn">➕</button>
        </div>
      </div>
      <div class="canvas-wrapper" id="canvasWrapper">
        <div class="zoom-container" id="zoomContainer">
          <canvas id="outCanvas" width="400" height="300"></canvas>
          <pre id="ascii" class="ascii empty">// Bild hochladen für Vorschau //</pre>
        </div>
      </div>
    </main>

  </div>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
